<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chronova | Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2c3f 0%, #1a4a5e 50%, #2f6f63 100%);
    overflow:hidden;
    position:relative;
}

/* ===== PARTICLES BACKGROUND ===== */
.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:rgba(212, 175, 55, 0.6);
    border-radius:50%;
    animation:float 15s infinite ease-in-out;
}

.particle:nth-child(1){left:10%;top:20%;animation-delay:0s;animation-duration:12s;}
.particle:nth-child(2){left:20%;top:80%;animation-delay:2s;animation-duration:14s;}
.particle:nth-child(3){left:30%;top:40%;animation-delay:4s;animation-duration:16s;}
.particle:nth-child(4){left:40%;top:60%;animation-delay:1s;animation-duration:13s;}
.particle:nth-child(5){left:50%;top:10%;animation-delay:3s;animation-duration:15s;}
.particle:nth-child(6){left:60%;top:70%;animation-delay:5s;animation-duration:17s;}
.particle:nth-child(7){left:70%;top:30%;animation-delay:2.5s;animation-duration:14s;}
.particle:nth-child(8){left:80%;top:50%;animation-delay:1.5s;animation-duration:16s;}
.particle:nth-child(9){left:90%;top:90%;animation-delay:4.5s;animation-duration:12s;}
.particle:nth-child(10){left:15%;top:55%;animation-delay:3.5s;animation-duration:18s;}
.particle:nth-child(11){left:25%;top:15%;animation-delay:0.5s;animation-duration:11s;}
.particle:nth-child(12){left:85%;top:25%;animation-delay:6s;animation-duration:19s;}

@keyframes float{
    0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:0.6;}
    25%{transform:translateY(-30px) translateX(10px) scale(1.2);opacity:0.8;}
    50%{transform:translateY(-60px) translateX(-10px) scale(0.8);opacity:0.4;}
    75%{transform:translateY(-30px) translateX(15px) scale(1.1);opacity:0.7;}
}

/* ===== OVERLAY ===== */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:center;
    align-items:center;
    animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

/* ===== SIGNUP BOX ===== */
.signup-box{
    width:380px;
    padding:40px 35px;
    border-radius:24px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,0.15),
        rgba(255,255,255,0.05)
    );
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:
        0 25px 60px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.1);
    text-align:center;
    color:#fff;
    animation:slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    position:relative;
    overflow:hidden;
}

@keyframes slideUp{
    from{transform:translateY(40px);opacity:0;}
    to{transform:translateY(0);opacity:1}
}

/* Decorative corner accents */
.signup-box::before,
.signup-box::after{
    content:'';
    position:absolute;
    width:60px;
    height:60px;
    border:2px solid rgba(212, 175, 55, 0.3);
}

.signup-box::before{
    top:0;
    left:0;
    border-right:none;
    border-bottom:none;
    border-radius:24px 0 0 0;
}

.signup-box::after{
    bottom:0;
    right:0;
    border-left:none;
    border-top:none;
    border-radius:0 0 24px 0;
}

.signup-box h2{
    margin-bottom:8px;
    font-size:28px;
    font-weight:300;
    letter-spacing:3px;
    text-transform:uppercase;
    background:linear-gradient(45deg, #d4af37, #f0d67a, #d4af37);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmerText 3s linear infinite;
}

@keyframes shimmerText{
    0%{background-position:0% center;}
    100%{background-position:200% center;}
}

.signup-box .subtitle{
    color:rgba(255,255,255,0.6);
    font-size:13px;
    margin-bottom:28px;
    letter-spacing:0.5px;
}

/* ===== INPUT WRAPPER ===== */
.input-wrapper{
    position:relative;
    margin-bottom:20px;
}

.input-wrapper input{
    width:100%;
    padding:16px 20px;
    padding-left:45px;
    border:none;
    border-radius:14px;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-size:14px;
    transition:all 0.3s ease;
    border:1px solid transparent;
}

.input-wrapper input::placeholder{
    color:rgba(255,255,255,0.4);
}

.input-wrapper input:focus{
    background:rgba(255,255,255,0.12);
    border-color:rgba(212, 175, 55, 0.5);
    box-shadow:0 0 20px rgba(212, 175, 55, 0.15);
}

.input-wrapper .icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:rgba(212, 175, 55, 0.7);
    font-size:16px;
    transition:all 0.3s ease;
}

.input-wrapper input:focus + .icon{
    color:#d4af37;
}

/* Password toggle */
.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:45px;
}

.toggle-password{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:rgba(255,255,255,0.5);
    transition:all 0.3s ease;
    font-size:14px;
}

.toggle-password:hover{
    color:#d4af37;
}

/* ===== PASSWORD STRENGTH ===== */
.password-strength{
    height:4px;
    background:rgba(255,255,255,0.1);
    border-radius:2px;
    margin-bottom:20px;
    overflow:hidden;
}

.password-strength .bar{
    height:100%;
    width:0;
    border-radius:2px;
    transition:all 0.4s ease;
}

.password-strength .bar.weak{width:33%;background:linear-gradient(90deg, #ff6b6b, #ee5a5a);}
.password-strength .bar.medium{width:66%;background:linear-gradient(90deg, #ffd93d, #f0c419);}
.password-strength .bar.strong{width:100%;background:linear-gradient(90deg, #6bcb77, #4ade80);}

.password-strength .label{
    font-size:11px;
    color:rgba(255,255,255,0.5);
    margin-top:6px;
    text-align:left;
    transition:all 0.3s ease;
}

/* ===== BUTTON ===== */
.signup-box button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg, #d4af37, #e6c547, #d4af37);
    background-size:200% auto;
    color:#1a1a1a;
    font-size:15px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    transition:all 0.4s ease;
    position:relative;
    overflow:hidden;
}

.signup-box button::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition:all 0.5s ease;
}

.signup-box button:hover{
    background-position:right center;
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(212, 175, 55, 0.4);
}

.signup-box button:hover::before{
    left:100%;
}

.signup-box button:active{
    transform:translateY(0);
}

/* Loading spinner */
.signup-box button .spinner{
    display:none;
    width:20px;
    height:20px;
    border:2px solid transparent;
    border-top-color:#1a1a1a;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto;
}

.signup-box button.loading .spinner{
    display:block;
}

.signup-box button.loading .btn-text{
    opacity:0;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* ===== LINK ===== */
.signup-box p{
    margin-top:24px;
    font-size:14px;
    color:rgba(255,255,255,0.6);
}

.signup-box a{
    color:#d4af37;
    text-decoration:none;
    font-weight:600;
    transition:all 0.3s ease;
    position:relative;
}

.signup-box a::after{
    content:'';
    position:absolute;
    bottom:-2px;
    left:0;
    width:0;
    height:1px;
    background:#d4af37;
    transition:width 0.3s ease;
}

.signup-box a:hover{
    color:#f0d67a;
}

.signup-box a:hover::after{
    width:100%;
}

/* ===== CONFETTI ===== */
.confetti{
    position:fixed;
    pointer-events:none;
    z-index:1000;
}

.confetti-piece{
    position:absolute;
    width:10px;
    height:10px;
    animation:confettiFall 3s ease-out forwards;
}

@keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}

/* ===== VALIDATION MESSAGE ===== */
.validation-msg{
    position:absolute;
    top:-8px;
    right:10px;
    font-size:11px;
    opacity:0;
    transition:all 0.3s ease;
}

.validation-msg.show{
    opacity:1;
}

.validation-msg.success{color:#6bcb77;}
.validation-msg.error{color:#ff6b6b;}
</style>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<!-- Particles Background -->
<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="overlay">
    <div class="signup-box">
        <h2>Create Account</h2>
        <p class="subtitle">Join the world of luxury timepieces</p>

        <div class="input-wrapper">
            <input id="name" type="text" placeholder="Full Name" autocomplete="name">
            <i class="fas fa-user icon"></i>
        </div>

        <div class="input-wrapper">
            <input id="email" type="email" placeholder="Email Address" autocomplete="email">
            <i class="fas fa-envelope icon"></i>
        </div>

        <div class="input-wrapper password-wrapper">
            <input id="password" type="password" placeholder="Password" autocomplete="new-password">
            <i class="fas fa-lock icon"></i>
            <span class="toggle-password" onclick="togglePassword('password')">
                <i class="fas fa-eye"></i>
            </span>
        </div>

        <div class="password-strength">
            <div class="bar"></div>
            <span class="label"></span>
        </div>

        <button onclick="signup()" id="signupBtn">
            <span class="btn-text">Sign Up</span>
            <div class="spinner"></div>
        </button>

        <p>Already have account? <a href="login.html">Login</a></p>
    </div>
</div>

<script>
function signup(){
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!name || !email || !password){
        alert("All fields required");
        return;
    }

    // Show loading
    const btn = document.getElementById("signupBtn");
    btn.classList.add("loading");
    btn.disabled = true;

    // Simulate loading delay
    setTimeout(() => {
        const user = { name, email, password };
        localStorage.setItem("chronova_user", JSON.stringify(user));
        
        // Show confetti
        showConfetti();
        
        setTimeout(() => {
            alert("Signup successful! ✅");
            window.location.href = "login.html";
        }, 500);
    }, 1000);
}

function togglePassword(inputId){
    const input = document.getElementById(inputId);
    const icon = document.querySelector(`[onclick="togglePassword('${inputId}')"] i`);
    
    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

// Password strength indicator
const passwordInput = document.getElementById("password");
const strengthBar = document.querySelector(".password-strength .bar");
const strengthLabel = document.querySelector(".password-strength .label");

passwordInput.addEventListener("input", function(){
    const password = this.value;
    const strength = checkPasswordStrength(password);
    
    strengthBar.className = "bar";
    strengthLabel.className = "label";
    
    if(password.length > 0){
        if(strength === "weak"){
            strengthBar.classList.add("weak");
            strengthLabel.textContent = "Weak password";
            strengthLabel.style.color = "#ff6b6b";
        } else if(strength === "medium"){
            strengthBar.classList.add("medium");
            strengthLabel.textContent = "Medium password";
            strengthLabel.style.color = "#ffd93d";
        } else if(strength === "strong"){
            strengthBar.classList.add("strong");
            strengthLabel.textContent = "Strong password";
            strengthLabel.style.color = "#6bcb77";
        }
    } else {
        strengthLabel.textContent = "";
    }
});

function checkPasswordStrength(password){
    let score = 0;
    
    if(password.length >= 8) score++;
    if(/[A-Z]/.test(password)) score++;
    if(/[a-z]/.test(password)) score++;
    if(/[0-9]/.test(password)) score++;
    if(/[^A-Za-z0-9]/.test(password)) score++;
    
    if(score <= 2) return "weak";
    if(score <= 3) return "medium";
    return "strong";
}

function showConfetti(){
    const colors = ['#d4af37', '#f0d67a', '#6bcb77', '#ff6b6b', '#4ecdc4'];
    const confettiContainer = document.createElement("div");
    confettiContainer.className = "confetti";
    document.body.appendChild(confettiContainer);
    
    for(let i = 0; i < 50; i++){
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        confettiContainer.appendChild(piece);
    }
    
    setTimeout(() => {
        confettiContainer.remove();
    }, 3500);
}

// Auto-focus on first input
document.addEventListener("DOMContentLoaded", function(){
    setTimeout(() => {
        document.getElementById("name").focus();
    }, 500);
});

// Enter key support
document.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        signup();
    }
});
</script>

</body>
</html>
